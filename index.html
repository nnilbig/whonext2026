<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WHONEXT 2026 羽球卡牌系統</title>
    <link rel="stylesheet" href="style.css?v=1.1">
</head>
<body>

    <!-- 全域控制列（改為絕對定位，不佔用垂直空間） -->
    <div class="top-controls">
        <button id="resetAllBtn" class="btn-top-action">全部重置</button>
        <button id="switchSidesBtn" class="btn-top-action">交換場地</button>
    </div>

    <div class="app-landscape-container">
        
        <!-- ================= 左側：藍隊 A ================= -->
        <div class="team-side team-blue">
            <div class="score-box">
                <div class="team-name">TEAM BLUE</div>
                <div class="score-display" id="scoreA">00</div>
                <div class="score-controls">
                    <button class="btn-score minus" onclick="changeScore('A', -1)">-</button>
                    <button class="btn-score plus" onclick="changeScore('A', 1)">+</button>
                </div>
            </div>

            <!-- 藍隊結果區（尺寸與卡池一致） -->
            <div class="flip-card-container" id="flipContainerA">
                <div class="card-front">
                    <div class="card-tag">等待抽卡</div>
                    <h2 id="cardTitleA">請抽卡</h2>
                    <p id="cardDescA">向上撥動下方卡牌...</p>
                </div>
            </div>
            
            <!-- 藍隊抽卡區（尺寸與結果一致） -->
            <div class="interactive-zone">
                <div class="card-deck" id="cardDeckA">
                    <div class="swipe-card" id="swipeCardA">
                        <img src="image/logo.png" alt="Card Cover" class="card-back-image" />
                    </div>
                    <div class="deck-shadow shadow-1"></div>
                    <div class="deck-shadow shadow-2"></div>
                </div>
                <div class="deck-label">藍隊卡池 (<span id="remCountA">22</span>)</div>
            </div>
        </div>

        <!-- ================= 右側：紅隊 B ================= -->
        <div class="team-side team-red">
            <div class="score-box">
                <div class="team-name">TEAM RED</div>
                <div class="score-display" id="scoreB">00</div>
                <div class="score-controls">
                    <button class="btn-score minus" onclick="changeScore('B', -1)">-</button>
                    <button class="btn-score plus" onclick="changeScore('B', 1)">+</button>
                </div>
            </div>

            <!-- 紅隊結果區（尺寸與卡池一致） -->
            <div class="flip-card-container" id="flipContainerB">
                <div class="card-front">
                    <div class="card-tag">等待抽卡</div>
                    <h2 id="cardTitleB">請抽卡</h2>
                    <p id="cardDescB">向上撥動下方卡牌...</p>
                </div>
            </div>
            
            <!-- 紅隊抽卡區（尺寸與結果一致） -->
            <div class="interactive-zone">
                <div class="card-deck" id="cardDeckB">
                    <div class="swipe-card" id="swipeCardB">
                        <img src="image/logo.png" alt="Card Cover" class="card-back-image" />
                    </div>
                    <div class="deck-shadow shadow-1"></div>
                    <div class="deck-shadow shadow-2"></div>
                </div>
                <div class="deck-label">紅隊卡池 (<span id="remCountB">22</span>)</div>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
